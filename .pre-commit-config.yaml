repos:
  - repo: local
    hooks:
      # Solidity
      - id: check-copyright-solidity
        name: Check copyright header - solidity
        entry: ./scripts/check-copyright-header.sh
        language: script
        files: \.sol$
        exclude: |
            (?x)^(
                .github/.*|
                build/.*|
                out/.*|
                lib/.*|
                docs/.*|
                .*\.md$
            )$
